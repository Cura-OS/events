name: CI

# Automatic PR gate. Until this landed, nothing in this repo ran typecheck,
# lint, or tests on a pull request. Not registered as a required status check.
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: [ self-hosted, linux, x64, fast ]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout CuraOS parent workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Cura-OS/curaos
          token: ${{ secrets.WORKSPACE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
          path: curaos-parent
          persist-credentials: false
          clean: true
          ref: 909113e0eeb84a91ace5ce5f4c03904abd16cac2
          fetch-depth: 1
          submodules: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Materialize workspace package members
        # Initialize every descendant at its recorded gitlink revision.
        working-directory: curaos-parent
        env:
          WORKSPACE_TOKEN: ${{ secrets.WORKSPACE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CURAOS_PARENT_REVISION"
          git diff --exit-code --ignore-submodules=all "$CURAOS_PARENT_REVISION" -- .
          retry_git() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 5 ]; then
                echo "retry_git: giving up after $attempt attempts" >&2
                return 1
              fi
              echo "retry_git: attempt $attempt failed; retrying in $((2 ** attempt))s" >&2
              sleep "$((2 ** attempt))"
              attempt=$((attempt + 1))
            done
          }
          credential_dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          credential_file="$credential_dir/curaos-git-credentials-$$"
          config_file="$credential_dir/curaos-gitconfig-$$"
          umask 077
          printf 'https://x-access-token:%s@github.com\n' "$WORKSPACE_TOKEN" > "$credential_file"
          git config --file "$config_file" credential.helper "store --file=$credential_file"
          git config --file "$config_file" url."https://github.com/".insteadOf git@github.com:
          export GIT_CONFIG_GLOBAL="$config_file"
          trap 'rm -f "$credential_file" "$config_file"' EXIT
          workspace_members=()
          while IFS= read -r workspace_member; do
            test -n "$workspace_member" || continue
            git config -f .gitmodules --get-regexp 'path$' | awk -v path="$workspace_member" '$2 == path { found = 1 } END { exit !found }' || continue
            workspace_members+=("$workspace_member")
          done < <(bun --eval 'import {readFileSync} from "node:fs";
          const lock = Bun.JSONC.parse(readFileSync("bun.lock", "utf8"));
          const workspaces = lock.workspaces ?? {};
          if (lock.lockfileVersion !== 1 || !workspaces[""]) throw Error("candidate lock format or workspaces unsupported");
          const byName = new Map(Object.entries(workspaces).map(([path, record]) => [record.name, path]));
          const queue = [
            ...Object.keys(workspaces).filter(Boolean),
            process.env.CURAOS_MEMBER_PATH,
            ...(process.env.CURAOS_SOURCE_SERVICES ?? "").split(/\s+/).filter(Boolean),
          ];
          for (const selectedPath of [...queue])
            for (const path of Object.keys(workspaces))
              if (path && selectedPath.startsWith(path + "/")) queue.push(path);
          const selected = new Set();
          for (let index = 0; index < queue.length; index += 1) {
            const path = queue[index];
            if (selected.has(path)) continue;
            selected.add(path);
            const record = workspaces[path];
            if (!record) continue;
            for (const field of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"])
              for (const name of Object.keys(record[field] ?? {})) {
                const dependency = byName.get(name);
                if (dependency && !selected.has(dependency)) queue.push(dependency);
              }
          }
          console.log([...selected].sort().join("\n"));')
          if [ "${#workspace_members[@]}" -gt 0 ]; then
            retry_git git -c "url.https://github.com/.insteadOf=git@github.com:" \
              -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=60 \
              submodule update --init --recursive --force --depth 1 --no-single-branch --jobs 4 "${workspace_members[@]}"
          fi
      - name: Overlay this revision into the parent workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: curaos-parent/backend/packages/events
          persist-credentials: false
          clean: true
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Materialize candidate member
        working-directory: curaos-parent
        env:
          WORKSPACE_TOKEN: ${{ secrets.WORKSPACE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CURAOS_PARENT_REVISION"
          test "$(git -C "$CURAOS_MEMBER_PATH" rev-parse HEAD)" = "$CURAOS_MEMBER_REVISION"
          retry_git() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 5 ]; then
                echo "retry_git: giving up after $attempt attempts" >&2
                return 1
              fi
              echo "retry_git: attempt $attempt failed; retrying in $((2 ** attempt))s" >&2
              sleep "$((2 ** attempt))"
              attempt=$((attempt + 1))
            done
          }
          credential_dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          credential_file="$credential_dir/curaos-git-credentials-$$"
          config_file="$credential_dir/curaos-gitconfig-$$"
          umask 077
          printf 'https://x-access-token:%s@github.com\n' "$WORKSPACE_TOKEN" > "$credential_file"
          git config --file "$config_file" credential.helper "store --file=$credential_file"
          git config --file "$config_file" url."https://github.com/".insteadOf git@github.com:
          export GIT_CONFIG_GLOBAL="$config_file"
          trap 'rm -f "$credential_file" "$config_file"' EXIT
          retry_git git -C "$CURAOS_MEMBER_PATH" \
            -c "url.https://github.com/.insteadOf=git@github.com:" \
            submodule update --init --recursive --force --depth 1 --jobs 1
          for source_service in ${CURAOS_SOURCE_SERVICES:-}; do
            retry_git git -c "url.https://github.com/.insteadOf=git@github.com:" \
              submodule update --init --recursive --force --depth 1 --jobs 1 "$source_service"
            test -f "$source_service/package.json"
          done
          member_directory="$(dirname "$CURAOS_MEMBER_PATH")"
          owner="$(git -C "$member_directory" rev-parse --show-toplevel)"
          index_path="$(git -C "$member_directory" rev-parse --show-prefix)$(basename "$CURAOS_MEMBER_PATH")"
          test "$(git -C "$owner" ls-files --stage -- "$index_path" | cut -d ' ' -f 1)" = 160000
          git -C "$owner" update-index --cacheinfo "160000,$CURAOS_MEMBER_REVISION,$index_path"

      - name: Install dependencies
        # Verify manifests against the selected parent lock, then install without changing it.
        working-directory: curaos-parent
        run: |
          set -euo pipefail
          export BUN_CONFIG_MAX_HTTP_REQUESTS=3
          bun_tmpdir="$PWD/.bun-tmp-$RANDOM-$$"
          bun_install="$PWD/.bun-install-$RANDOM-$$"
          bun_cache="${BUN_INSTALL_CACHE_DIR:-$PWD/.bun-cache-$RANDOM-$$}"
          /bin/mkdir -p "$bun_tmpdir" "$bun_install" "$bun_cache"
          trap '/bin/rm -rf "$bun_tmpdir" "$bun_install"' EXIT
          export BUN_TMPDIR="$bun_tmpdir"
          export BUN_INSTALL="$bun_install"
          export BUN_INSTALL_CACHE_DIR="$bun_cache"
          test -f bun.lock
          test ! -L bun.lock
          git cat-file -e "$CURAOS_PARENT_REVISION:bun.lock"
          CURAOS_WORKSPACE_CLOSURE="$(bun --eval 'import {readFileSync} from "node:fs";
          const lock = Bun.JSONC.parse(readFileSync("bun.lock", "utf8"));
          const workspaces = lock.workspaces ?? {};
          if (lock.lockfileVersion !== 1 || !workspaces[""]) throw Error("candidate lock format or workspaces unsupported");
          const byName = new Map(Object.entries(workspaces).map(([path, record]) => [record.name, path]));
          const queue = [
            ...Object.keys(workspaces).filter(Boolean),
            process.env.CURAOS_MEMBER_PATH,
            ...(process.env.CURAOS_SOURCE_SERVICES ?? "").split(/\s+/).filter(Boolean),
          ];
          for (const selectedPath of [...queue])
            for (const path of Object.keys(workspaces))
              if (path && selectedPath.startsWith(path + "/")) queue.push(path);
          const selected = new Set();
          for (let index = 0; index < queue.length; index += 1) {
            const path = queue[index];
            if (selected.has(path)) continue;
            selected.add(path);
            const record = workspaces[path];
            if (!record) continue;
            for (const field of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"])
              for (const name of Object.keys(record[field] ?? {})) {
                const dependency = byName.get(name);
                if (dependency && !selected.has(dependency)) queue.push(dependency);
              }
          }
          console.log([...selected].sort().join("\n"));')"
          export CURAOS_WORKSPACE_CLOSURE
          bun --eval 'import {existsSync, readFileSync} from "node:fs";
          import {isDeepStrictEqual} from "node:util";
          const read = (path) => JSON.parse(readFileSync(path, "utf8"));
          const root = read("package.json");
          const lock = Bun.JSONC.parse(readFileSync("bun.lock", "utf8"));
          if (!Array.isArray(root.workspaces) || lock.lockfileVersion !== 1) throw Error("candidate lock format or workspaces unsupported");
          const selected = new Set((process.env.CURAOS_WORKSPACE_CLOSURE ?? "").split(/\s+/).filter(Boolean));
          selected.add("");
          const recordedWorkspaces = lock.workspaces ?? {};
          for (const path of selected) {
            if (path && !existsSync(path + "/package.json")) continue;
            const manifest = path ? read(path + "/package.json") : root;
            const recorded = recordedWorkspaces[path];
            if (!recorded) throw Error("candidate lock workspace missing: " + path);
            if (manifest.name !== recorded.name || (path && manifest.version !== recorded.version)) throw Error("candidate lock identity differs: " + path);
            for (const field of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              const declared = manifest[field] ?? {};
              const locked = recorded[field] ?? {};
              for (const [name, value] of Object.entries(declared)) if (!(name in locked) && (root[field] ?? {})[name] !== value) throw Error("candidate lock declaration is not represented by root or workspace lock: " + path + " " + field + " " + name);
            }
            const optionalPeers = Object.entries(manifest.peerDependenciesMeta ?? {}).filter(([, meta]) => meta.optional === true).map(([name]) => name).sort();
            if (!isDeepStrictEqual(optionalPeers, [...(recorded.optionalPeers ?? [])].sort())) throw Error("candidate lock optional peers differ: " + path);
          }
          '
          install_filters=(--filter .)
          while IFS= read -r workspace_member; do
            test -n "$workspace_member" || continue
            install_filters+=(--filter "./$workspace_member")
          done <<< "$CURAOS_WORKSPACE_CLOSURE"
          bun install --frozen-lockfile --ignore-scripts "${install_filters[@]}"
          bun --eval 'import {existsSync, readFileSync} from "node:fs";
          import {isDeepStrictEqual} from "node:util";
          const read = (path) => JSON.parse(readFileSync(path, "utf8"));
          const root = read("package.json");
          const lock = Bun.JSONC.parse(readFileSync("bun.lock", "utf8"));
          if (!Array.isArray(root.workspaces) || lock.lockfileVersion !== 1) throw Error("candidate lock format or workspaces unsupported");
          const selected = new Set((process.env.CURAOS_WORKSPACE_CLOSURE ?? "").split(/\s+/).filter(Boolean));
          selected.add("");
          const recordedWorkspaces = lock.workspaces ?? {};
          for (const path of selected) {
            if (path && !existsSync(path + "/package.json")) continue;
            const manifest = path ? read(path + "/package.json") : root;
            const recorded = recordedWorkspaces[path];
            if (!recorded) throw Error("candidate lock workspace missing: " + path);
            if (manifest.name !== recorded.name || (path && manifest.version !== recorded.version)) throw Error("candidate lock identity differs: " + path);
            for (const field of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              const declared = manifest[field] ?? {};
              const locked = recorded[field] ?? {};
              for (const [name, value] of Object.entries(declared)) if (!(name in locked) && (root[field] ?? {})[name] !== value) throw Error("candidate lock declaration is not represented by root or workspace lock: " + path + " " + field + " " + name);
            }
            const optionalPeers = Object.entries(manifest.peerDependenciesMeta ?? {}).filter(([, meta]) => meta.optional === true).map(([name]) => name).sort();
            if (!isDeepStrictEqual(optionalPeers, [...(recorded.optionalPeers ?? [])].sort())) throw Error("candidate lock optional peers differ: " + path);
          }
          '

      - name: Build workspace dependencies
        # `bun run typecheck` inside the slot does not build this package's
        # workspace siblings, and packages consumed through their `dist/` then
        # fail to resolve (admin-app run 30789521776: "Cannot find module
        # '@curaos/ui'" plus a TS7006 cascade downstream of it). The `^...`
        # suffix is turbo's "dependencies of, excluding itself" selector.
        working-directory: curaos-parent
        run: bunx turbo run build --filter='@curaos/events^...'

      - name: Run repo gates
        working-directory: curaos-parent/backend/packages/events
        run: |
          set -euo pipefail
          # Required package tasks
          build_task="build"
          if node -e 'process.exit(require("./package.json").dependencies?.expo ? 0 : 1)'; then
            build_task="export"
          fi
          node -e '
            const scripts = require("./package.json").scripts ?? {};
            const missing = process.argv.slice(1).filter(task => typeof scripts[task] !== "string" || !scripts[task].trim());
            if (missing.length) throw new Error("Missing required package commands: " + missing.join(", "));
          ' lint typecheck test "$build_task"
          for task in lint typecheck test "$build_task"; do
            bun run "$task" || exit "$?"
          done
          # Preserve repository-specific obligations until the task graph owns them.
          if node -e 'process.exit(require("./package.json").scripts?.ci ? 0 : 1)'; then
            bun run ci
          fi
    env:
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      CURAOS_PARENT_REVISION: 909113e0eeb84a91ace5ce5f4c03904abd16cac2
      CURAOS_MEMBER_PATH: backend/packages/events
      CURAOS_MEMBER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      CURAOS_SOURCE_SERVICES: ""
      NPM_CONFIG_REGISTRY: http://100.77.52.131:8081/repository/npm-group/
